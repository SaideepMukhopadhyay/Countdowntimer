<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <div id="timer">00:00:00:00</div>

        <div class="input-container">
            <input type="number" id="daysInput" placeholder="Days" min="0">
            <input type="number" id="hoursInput" placeholder="Hours" min="0" max="23">
            <input type="number" id="minutesInput" placeholder="Minutes" min="0" max="59">
            <input type="number" id="secondsInput" placeholder="Seconds" min="0" max="59">
        </div>

        <button onclick="startTimer()">Start Countdown</button>
    </div>

    <audio id="alarm-sound" src="tropical-alarm-clock-168821.mp3"></audio> <!-- The audio file -->
    
    <script src="script.js"></script>
</body>
</html>
